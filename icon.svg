<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with safe zone radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow rings -->
  <circle cx="256" cy="245" r="180" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.3" stroke-dasharray="10 12" />
  <circle cx="256" cy="245" r="210" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.2" />

  <!-- Bell group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Top hanger -->
    <path d="M236 100 C236 88, 276 88, 276 100 L276 128 L236 128 Z" fill="url(#accentGrad)" />
    <circle cx="256" cy="95" r="18" fill="none" stroke="url(#accentGrad)" stroke-width="12" />

    <!-- Bell Body -->
    <path d="M256 130 C190 130, 150 180, 140 280 C135 320, 115 340, 100 355 C90 365, 95 385, 115 385 L397 385 C417 385, 422 365, 412 355 C397 340, 377 320, 372 280 C362 180, 322 130, 256 130 Z" fill="url(#bellGrad)" />

    <!-- Clapper / Striker -->
    <circle cx="256" cy="415" r="32" fill="url(#accentGrad)" />
    
    <!-- Sound Waves -->
    <path d="M435 210 C465 240, 465 290, 435 320" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M77 210 C47 240, 47 290, 77 320" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
